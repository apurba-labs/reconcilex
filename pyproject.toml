[project]
name = "reconcilex"
version = "0.1.0"
description = "Evidence-backed agentic payment reconciliation and financial exception investigation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.20.0",
    "openai>=3.6.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconcilex"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
